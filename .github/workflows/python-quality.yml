name: Python quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Black formatting
        run: python -m black --check src backend app tests brayan scripts app.py

      - name: Run Flake8
        run: python -m flake8 src backend app tests brayan scripts app.py

      - name: Run Ruff
        run: python -m ruff check src backend app tests brayan scripts app.py

      - name: Run Pylint
        run: python -m pylint src backend app tests scripts app.py --score=y

      - name: Run MyPy on typed application core
        run: python -m mypy src/contracts.py src/chatbot src/nlp src/recommender backend

      - name: Run security and dependency audits
        run: |
          python -m bandit -q -r src backend app scripts app.py
          python -m pip_audit -r requirements.txt
          python -m deptry .

      - name: Enforce architecture, documentation, and complexity gates
        run: |
          lint-imports
          interrogate src backend app scripts app.py
          xenon --max-absolute C --max-modules B --max-average A app backend src tests
          vulture src backend app tests scripts app.py --min-confidence 80

      - name: Run tests with coverage
        run: >-
          python -m pytest
          --cov=src.chatbot
          --cov=src.nlp
          --cov=src.recommender
          --cov=backend.services.language_service
          --cov-report=term-missing
          --cov-report=xml
